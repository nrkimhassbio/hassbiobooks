<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>책 리스트</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js"></script>
</head>
<body>
  <h1>📘 책 리스트</h1>
  <ul id="book-list"></ul>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB5r6Vp5dseDyqFKxmjZ3ReQncqR62022k",
      authDomain: "bookrentalv2.firebaseapp.com",
      projectId: "bookrentalv2",
      storageBucket: "bookrentalv2.firebasestorage.app",
      messagingSenderId: "83410489800",
      appId: "1:83410489800:web:ce9b18509edb70873bb0fd"
    };
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function loadBooks() {
      const listEl = document.getElementById("book-list");
      const snap = await db.collection("books").get();
      snap.forEach(doc => {
        const book = doc.data();
        const li = document.createElement("li");
        li.textContent = `${book.title} – ${book.author}`;
        li.onclick = () => alert(book.description || "설명 없음");
        listEl.appendChild(li);
      });
    }

    loadBooks();
  </script>
</body>
</html>
